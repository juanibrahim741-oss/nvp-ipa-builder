name: Produce CoreML shards (NVP-D)

# Produces CoreML model artifacts on the macOS runner (coremltools) for the
# distributed NVP Beta. Stage 1 = a palettized whole-model .mlmodelc; multi-shard
# split is iterated on top. Run manually (Run workflow) with an optional model id.
# Publishes the result as a Release so the coordinator auto-registers it in NVP-D.
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "HF model id (ungated)"
        required: false
        default: "unsloth/Llama-3.2-1B-Instruct"

permissions:
  contents: write # publish the shard Release

jobs:
  shards:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MODEL_ID: ${{ github.event.inputs.model_id }}
      OUT_DIR: ${{ github.workspace }}/build_shards
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --upgrade pip
          # Pin a coremltools-tested torch (2.12 breaks conversion) + numpy<2.
          # transformers 4.51.x recognizes newer archs (Qwen3, etc.); 4.46 did not.
          # scikit-learn pinned to <=1.5.1 (coremltools 8.1 rejects newer for k-means).
          "$RUNNER_TEMP/venv/bin/pip" install --quiet \
            "torch==2.5.1" "transformers==4.51.3" "coremltools==8.1" "numpy<2" \
            "scikit-learn==1.5.1" "sentencepiece" "protobuf"

      - name: Convert to CoreML
        run: |
          "$RUNNER_TEMP/venv/bin/python" shards/convert_shards.py
          echo "--- build_shards ---"; ls -la "$OUT_DIR" || true

      - name: Compile .mlpackage -> .mlmodelc
        run: |
          cd "$OUT_DIR" || exit 0
          for pkg in *.mlpackage; do
            [ -e "$pkg" ] || continue
            echo "Compiling $pkg"
            xcrun coremlcompiler compile "$pkg" .
          done
          ls -la

      - name: Package release assets (zip each shard + tokenizer + manifest)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_assets"
          cd "$OUT_DIR" || exit 0
          for d in shard_*.mlmodelc; do
            [ -e "$d" ] || continue
            ditto -c -k --sequesterRsrc --keepParent "$d" "$GITHUB_WORKSPACE/release_assets/${d}.zip"
          done
          [ -d tokenizer ] && ditto -c -k --keepParent tokenizer "$GITHUB_WORKSPACE/release_assets/tokenizer.zip" || true
          cp manifest.json "$GITHUB_WORKSPACE/release_assets/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/release_assets"

      - name: Compute release tag
        run: |
          slug=$(echo "$MODEL_ID" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "TAG=shards-$slug" >> "$GITHUB_ENV"

      - name: Publish shards as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "NVP-D shards — ${{ env.MODEL_ID }}"
          body: "CoreML shards for ${{ env.MODEL_ID }}. Auto-published for NVP-D."
          files: release_assets/*
          fail_on_unmatched_files: false

      - name: Upload shard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nvp-coreml-shards
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
