name: NVPNode
# Gemma 4 E2B on-device via Gemma4SwiftCore (mlx-swift-lm 2.30.x).
options:
  bundleIdPrefix: com.nvp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual

packages:
  # Versions chosen to match what Gemma4SwiftCore 0.1.0 requires (mlx-swift-lm 2.31.x).
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minVersion: "2.31.0"
    maxVersion: "3.0.0"
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    minVersion: "0.31.0"
    maxVersion: "0.32.0"
  Swift-gemma4-core:
    url: https://github.com/yejingyang8963-byte/Swift-gemma4-core
    from: "0.1.0"
  # Trust Wallet Core — BIP39 mnemonic, HD keys, Ethereum signing (NVP wallet).
  WalletCore:
    url: https://github.com/trustwallet/wallet-core
    from: "4.2.9"
  # swift-transformers — tokenizer for the NVP-D distributed pipeline.
  # Version aligned with mlx-swift-lm (1.2.x) so SPM resolves a single copy.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    minVersion: "1.2.0"
    maxVersion: "1.3.0"
  # ZIPFoundation — unzip the CoreML shard archives downloaded for NVP-D split mode.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.0"

targets:
  NVPNode:
    type: application
    platform: iOS
    sources:
      - path: NVPNode
      # Pre-installed MLX models, downloaded into ios/Models/<id>/ at build time
      # (see the CI workflow). Folder reference → copied into the app bundle as
      # Models/<id>/, so the app loads them with no on-device download.
      - path: Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift
        product: MLX
      - package: Swift-gemma4-core
        product: Gemma4SwiftCore
      - package: swift-transformers
        product: Tokenizers
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: WalletCore
        product: WalletCore
      - package: WalletCore
        product: WalletCoreSwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nvp.node
        CODE_SIGN_ENTITLEMENTS: NVPNode/NVPNode.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NVP Node
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      # The coordinator should be served over HTTPS (e.g. Vercel); iOS ATS
      # permits that by default and also allows http://localhost for dev.

schemes:
  NVPNode:
    build:
      targets:
        NVPNode: all
    run:
      config: Debug
    archive:
      config: Release
